# Blueprint for Nonroute. Render prompts for secrets during initial setup.
# A persistent disk and a paid database plan may incur charges; review costs in Render before applying.
services:
  - type: web
    name: nonroute
    runtime: node
    plan: starter
    region: singapore
    branch: feature/pdr-foundation
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: nonroute-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: nonroute-prod-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GATEWAY_API_TOKEN
        generateValue: true
      - key: COOKIE_ENCRYPTION_KEY
        generateValue: true
      - key: PROJECT_ROOT
        value: /var/data/projects
      - key: OMNIROUTE_DATA_DIR
        value: /var/data/omniroute
      - key: AUTO_DISCOVER_PROVIDERS
        value: "false"
      - key: LLM7_ENDPOINT
        value: https://api.llm7.io/v1/chat/completions
      - key: KILO_ENDPOINT
        value: https://api.kilo.ai/api/gateway/chat/completions
      - key: UNCLOSEAI_ENDPOINT
        value: https://hermes.ai.unturf.com/v1/chat/completions
      - key: DUCKDUCKGO_ENDPOINT
        sync: false
      - key: PUTER_ENDPOINT
        sync: false
      - key: LMARENA_ENDPOINT
        sync: false
      - key: LMARENA_REFRESH_URL
        sync: false
      - key: OPENCODE_RELAY_BASE_URL
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDFLARE_AI_BASE_URL
        sync: false
      - key: CLOUDFLARE_AI_TOKEN
        sync: false
      - key: CLOUDFLARE_AI_MODEL
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
databases:
  - name: nonroute-prod-db
    databaseName: nonroute
    plan: basic_256mb
    region: singapore
    postgresMajorVersion: "18"
