name: Update OmniRoute package

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdr-foundation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Check npm release and update dependency
        shell: bash
        run: |
          set -euo pipefail
          latest="$(npm view omniroute version)"
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.dependencies.omniroute=process.argv[1]; fs.writeFileSync("package.json", JSON.stringify(p,null,2)+"\n");' "$latest"
          if git diff --quiet -- package.json; then
            echo "OmniRoute is already current: $latest"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: update OmniRoute to $latest"
          git push origin HEAD:feature/pdr-foundation
